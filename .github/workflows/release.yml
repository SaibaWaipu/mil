name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --workspace --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mil dist/mil-${{ matrix.target }}
          tar -czf mil-${{ matrix.target }}.tar.gz -C dist mil-${{ matrix.target }}
          sha256sum mil-${{ matrix.target }}.tar.gz > mil-${{ matrix.target }}.tar.gz.sha256

      - name: Upload release assets (unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mil-${{ matrix.target }}.tar.gz
            mil-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\mil.exe dist\mil-${{ matrix.target }}.exe
          Compress-Archive -Path dist\mil-${{ matrix.target }}.exe -DestinationPath mil-${{ matrix.target }}.zip
          (Get-FileHash mil-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  mil-${{ matrix.target }}.zip" | Out-File -Encoding ascii mil-${{ matrix.target }}.zip.sha256

      - name: Upload release assets (windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mil-${{ matrix.target }}.zip
            mil-${{ matrix.target }}.zip.sha256
          generate_release_notes: true
