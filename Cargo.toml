[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
authors = ["Saiba Waipu <SaibaWaipu@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SaibaWaipu/mil"
homepage = "https://github.com/SaibaWaipu/mil"
description = "A fast, minimal terminal web browser written in Rust"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "fs", "io-util"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
dirs = "6"
ratatui = "0.30.1"
crossterm = "0.29"
ratatui-image = { version = "11", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
http = "1"
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
indexmap = "2"
insta = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
